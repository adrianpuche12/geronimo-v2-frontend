name: Deploy Frontend DEV

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen DEV
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: adrianpuche/iurivia-frontend:dev-latest
          build-args: |
            REACT_APP_API_URL=http://62.171.160.238:3008
            REACT_APP_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy en servidor
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@62.171.160.238 "
            cd /opt/iurivia/dev &&
            docker compose pull iurivia-frontend-dev &&
            docker compose up -d iurivia-frontend-dev &&
            docker image prune -f
          "
          rm /tmp/deploy_key
