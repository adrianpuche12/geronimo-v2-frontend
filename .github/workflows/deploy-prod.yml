name: Deploy Frontend PROD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen PROD
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: adrianpuche/iurivia-frontend:latest
          build-args: |
            REACT_APP_API_URL=https://api.lexiius.com
            REACT_APP_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy en servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/iurivia/prod
            docker compose pull iurivia-frontend
            docker compose up -d iurivia-frontend
            docker image prune -f
