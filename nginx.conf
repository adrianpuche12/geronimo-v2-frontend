server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve el gateway en cada request (si el gateway
    # reinicia, nginx no queda con una IP vieja ni falla al arrancar).
    resolver 127.0.0.11 valid=30s;

    # Auth (GoTrue self-hosted). AUTH_GATEWAY lo define docker-compose por ambiente,
    # p. ej. http://iurivia-gateway-dev. Se publica solo /auth/v1, nunca /rest/v1.
    # proxy_pass con variable reenvía la URI original (/auth/v1/...) al gateway.
    location /auth/v1/ {
        set $auth_gateway ${AUTH_GATEWAY};
        proxy_pass $auth_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
